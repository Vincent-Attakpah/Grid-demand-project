name: forecast

# Hourly live forecast (plan v2 section 10). Runs right after each logger run, whether the
# logger was started by its schedule or by the laptop backup, so it inherits the :17 timing
# and the backup. Model bundle: GitHub release `live-models` (refit monthly on the laptop,
# `python -m nowcaster.live.train --upload`). Output: the orphan branch `live`
# (history/, peaks/, site/index.html, site/scores.json, status.json). A re-run for an hour
# that is already issued writes no new forecasts.

on:
  workflow_run:
    workflows: [logger]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          path: code
          sparse-checkout: |
            src
            config

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: code/.github/workflows/forecast.yml

      # Same versions as the laptop that trains the bundle (pickled LightGBM models).
      - name: Install dependencies
        run: >
          pip install --quiet --disable-pip-version-check
          pandas==2.3.3 numpy==2.2.6 lightgbm==4.7.0 pyarrow==25.0.1 requests==2.34.2
          PyYAML==6.0.3 holidays==0.107 duckdb

      - name: Download model bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download live-models --repo "${{ github.repository }}" --pattern bundle.pkl.gz --dir .

      - name: Check out live branch
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads "$REPO_URL" live >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch live "$REPO_URL" live
          else
            mkdir live && cd live
            git init --quiet -b live
            git remote add origin "$REPO_URL"
          fi
          cd live
          git config user.name "nowcaster-forecast"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run forecast
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          PYTHONPATH: code/src
          PYTHONWARNINGS: ignore
        run: python -m nowcaster.live.run --root live --bundle bundle.pkl.gz

      - name: Commit and push
        if: always()
        run: |
          set -uo pipefail
          cd live
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit --quiet -m "forecast $(date -u +%Y-%m-%dT%H:%MZ) run ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            if git push --quiet origin HEAD:live; then exit 0; fi
            echo "push failed (attempt $i); rebasing on remote"
            git fetch --quiet --depth 5 origin live && git rebase --quiet FETCH_HEAD || git rebase --abort || true
            sleep $((i * 5))
          done
          exit 1
