    tz: America/New_York
    notes: Northwest Florida (Gulf Power) consolidated mid-2022; Pensacola weighted from 2022-07.
    cities:
      # South Florida is one MSA spanning three counties, so county populations are used.
      - {name: Miami,           state: FL, lat: 25.762, lon: -80.192, pop: 2701751}
      - {name: Fort Lauderdale, state: FL, lat: 26.122, lon: -80.137, pop: 1944404}
      - {name: West Palm Beach, state: FL, lat: 26.715, lon: -80.053, pop: 1492202}
      - {name: Sarasota,        state: FL, lat: 27.336, lon: -82.531, pop: 833724}
      - {name: Fort Myers,      state: FL, lat: 26.640, lon: -81.872, pop: 760822}
      - {name: Melbourne,       state: FL, lat: 28.084, lon: -80.608, pop: 606607}
      - {name: Daytona Beach,   state: FL, lat: 29.211, lon: -81.023, pop: 553544}
      - {name: Port St. Lucie,  state: FL, lat: 27.273, lon: -80.358, pop: 487654}
      # Former Gulf Power territory (NW Florida); see SOCO Pensacola for the boundary date.
      - {name: Pensacola,       state: FL, lat: 30.421, lon: -87.217, pop: 509902, active_from: "2022-07-01"}
