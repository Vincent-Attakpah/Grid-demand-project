      - {name: Knoxville,    state: TN, lat: 35.961, lon: -83.921, pop: 190740}
      - {name: Chattanooga,  state: TN, lat: 35.046, lon: -85.309, pop: 181099}
      - {name: Huntsville,   state: AL, lat: 34.730, lon: -86.586, pop: 215006}
