      - {name: Savannah,     state: GA, lat: 32.081, lon: -81.091, pop: 147780}
      - {name: Augusta,      state: GA, lat: 33.471, lon: -81.975, pop: 202081}
      - {name: Columbus,     state: GA, lat: 32.461, lon: -84.988, pop: 206922}
