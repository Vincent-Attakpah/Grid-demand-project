# Balancing-authority configuration. Single source of truth for BA codes, time zones,
# weather cities and the point-in-time lag rules (plan v2, sections 4.1, 6.1, 7.1).
#
# Times: everything is stored in UTC, hour-ending. `tz` defines the BA's operating day
# (EIA-930 reports each BA in a local "time zone of record"; verify against EIA's BA list).
#
# Weather cities: one representative point per population centre. `pop` is the 2020 Census
# base population (Census PEP vintage 2024, ESTIMATESBASE2020) of the metro area (MSA) or,
# where an MSA spans several BAs/utilities, of the county served. Optional `active_from` /
# `active_until` (ISO dates, half-open) bound when a city counts toward the BA's weights.
# Sources and reasoning per city: docs/weather_cities.md.

weather:
  model: gfs_seamless          # fixed named model, identical in backtest and live
  variables:
    - temperature_2m
    - dew_point_2m
    - wind_speed_10m
    - cloud_cover
    - shortwave_radiation
    - relative_humidity_2m

lags:
  # Placeholders that err late (plan 7.1). Replace with logger-measured p95 values.
  demand_available_hours_after_hour_end: 3
  da_forecast_available_local_time: "10:00"
  da_forecast_available_tz: America/New_York
  weather_run_availability_hours: 6   # a GFS run is usable ~this long after init

bas:
  SOCO:
    name: Southern Company Services
    priority: core
    tz: America/Chicago        # VERIFY: EIA time zone of record for SOCO
    notes: Check for a 2022 demand step when Gulf Power load moved to FPL.
    cities:
      - {name: Atlanta,         state: GA, lat: 33.749, lon: -84.388, pop: 6106805}
      - {name: Birmingham,      state: AL, lat: 33.519, lon: -86.810, pop: 1180600}
      - {name: Augusta,         state: GA, lat: 33.471, lon: -81.975, pop: 610980}
      - {name: Gulfport-Biloxi, state: MS, lat: 30.396, lon: -88.990, pop: 416256}
      - {name: Mobile,          state: AL, lat: 30.695, lon: -88.040, pop: 414810}
      - {name: Savannah,        state: GA, lat: 32.081, lon: -81.091, pop: 404795}
      - {name: Montgomery,      state: AL, lat: 32.367, lon: -86.300, pop: 386056}
      - {name: Columbus,        state: GA, lat: 32.461, lon: -84.988, pop: 328872}
      - {name: Tuscaloosa,      state: AL, lat: 33.210, lon: -87.569, pop: 269780}
      - {name: Macon,           state: GA, lat: 32.841, lon: -83.632, pop: 233799}
      # Gulf Power (NW Florida) sat in the SOCO BA until its move to FPL. Boundary date is a
      # placeholder: replace with the step date the EIA structural-break audit finds.
      - {name: Pensacola,       state: FL, lat: 30.421, lon: -87.217, pop: 509902, active_until: "2022-07-01"}
  TVA:
    name: Tennessee Valley Authority
    priority: core
    tz: America/Chicago
    cities:
