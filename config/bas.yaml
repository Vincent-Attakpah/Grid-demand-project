      - {name: Memphis,      state: TN, lat: 35.150, lon: -90.049, pop: 1345440}
      - {name: Knoxville,    state: TN, lat: 35.961, lon: -83.921, pop: 903474}
      - {name: Chattanooga,  state: TN, lat: 35.046, lon: -85.309, pop: 563308}
      - {name: Huntsville,   state: AL, lat: 34.730, lon: -86.586, pop: 491717}
      - {name: Clarksville,  state: TN, lat: 36.530, lon: -87.359, pop: 320524}
      - {name: Johnson City, state: TN, lat: 36.313, lon: -82.354, pop: 207280}
  DUK:
    name: Duke Energy Carolinas
    priority: core
    tz: America/New_York
    cities:
      - {name: Charlotte,     state: NC, lat: 35.227, lon: -80.843, pop: 2660162}
      - {name: Greenville,    state: SC, lat: 34.852, lon: -82.394, pop: 928208}
      - {name: Greensboro,    state: NC, lat: 36.073, lon: -79.792, pop: 776508}
      - {name: Winston-Salem, state: NC, lat: 36.100, lon: -80.244, pop: 675981}
      - {name: Durham,        state: NC, lat: 35.994, lon: -78.899, pop: 588910}
      - {name: Hickory,       state: NC, lat: 35.733, lon: -81.341, pop: 365281}
