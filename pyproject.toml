[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nowcaster"
version = "0.1.0"
description = "Live hourly grid demand nowcaster for U.S. balancing authorities (EIA-930 + Open-Meteo)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "duckdb>=0.10",
    "requests>=2.31",
    "pyyaml>=6",
    "holidays>=0.40",
    "astral>=3.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: test hits a live external API (skipped unless NOWCASTER_NETWORK_TESTS=1)",
]
